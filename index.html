
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TypeTasks | My Task Board</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="wrap">
    <h1>TypeTasks ✨</h1>
    <p class="subtitle">Small steps, big progress.</p>

    <div class="addrow">
      <input id="title" type="text" placeholder="Add a task..." />
      <button id="add">Add task</button>
    </div>

    <div id="chips" class="chips">
      <button data-filter="all" class="active">All</button>
      <button data-filter="todo">To do</button>
      <button data-filter="in-progress">In progress</button>
      <button data-filter="done">Done</button>
    </div>

    <ul id="list"></ul>
    <p id="empty">No tasks yet. Add your first one!</p>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
